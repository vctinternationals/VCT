{{$common := site.Data.common}}

<!-- Page Header Start -->
<div class="container-fluid page-header py-5 mb-5 wow fadeIn" data-wow-delay="0.1s">
    <div class="container text-center py-5">
        <h1 class="display-4 text-white animated slideInDown mb-4">Contact Us</h1>
        <p class="mb-1">If You Have Any Query, Please Contact Us</p>
        <p>We'd love to talk about how we can help you.</p>
    </div>
</div>
<!-- Page Header End -->


<!-- Contact Start -->
<div class="container-xxl py-5">
    <div class="container">
        <form action="https://api.staticforms.xyz/submit" method="POST" class="card shadow-sm mx-auto"
            style="max-width:800px;" id="contactForm" novalidate>
            <input hidden name="apiKey" value="sf_c4innj67fclc763hbe9mg86n" >
            <input type="hidden" name="redirectTo" value="https://vctinternationals.com">
            <!-- hidden replyTo will be filled from email input -->
            <input type="hidden" name="replyTo" id="replyTo" value="">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" name="name" type="text" class="form-control" placeholder="Your name" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control" placeholder="you@domain.com"
                            required>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input id="phone" name="phone" type="tel" class="form-control" placeholder="+91 99999 99999"
                            required>
                        <div class="invalid-feedback">Please enter your phone number.</div>
                    </div>

                    <div class="col-md-6">
                        <label for="serviceLocation" class="form-label">Service location</label>
                        <select id="serviceLocation" name="serviceLocation" class="form-select" required>
                            <option value="" selected disabled>Choose location</option>
                            <option value="India (Hyderabad)">India (Hyderabad)</option>
                            <option value="Dubai">Dubai</option>
                        </select>
                        <div class="invalid-feedback">Please select a service location.</div>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" rows="5" class="form-control" placeholder="Your message"
                            required maxlength="1000"></textarea>
                        <div class="form-text text-end"><small><span id="charCount">0</span>/1000</small></div>
                        <div class="invalid-feedback">Please enter a message.</div>
                    </div>

                    <div class="col-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Contact End -->
 <script>
  (function () {
    'use strict';
    var form = document.getElementById('contactForm');
    var email = document.getElementById('email');
    var replyTo = document.getElementById('replyTo');
    var ta = document.getElementById('message');
    var counter = document.getElementById('charCount');

    if (email && replyTo) {
      // keep replyTo in sync with email
      function syncReply(){ replyTo.value = email.value || ''; }
      email.addEventListener('input', syncReply);
      syncReply();
    }

    if (ta && counter) {
      function update(){ counter.textContent = ta.value.length; }
      ta.addEventListener('input', update);
      update();
    }

    if (!form) return;
    form.addEventListener('submit', function (event) {
      // ensure replyTo filled before validation
      if (email && replyTo) replyTo.value = email.value || '';
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>
